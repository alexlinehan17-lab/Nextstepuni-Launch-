<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#fff}iframe{display:block;border:0}</style></head>
<body><iframe id="f"></iframe>
<script>
  const p = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.width = p.get('w') || '390'; f.height = p.get('h') || '1600'; f.src = p.get('src') || 'about:blank';
</script></body></html>
