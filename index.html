
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NextStepUni: The Learning Lab</title>
    <meta name="theme-color" content="#131311" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/north-star-apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/north-star-favicon-32x32.png" />
    <style>
      @font-face {
        font-family: 'Apercu Mono Pro';
        src: url('/fonts/ApercuMonoPro.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700&family=DM+Sans:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent iOS auto-zoom on input focus (triggered when font-size < 16px) */
      @supports (-webkit-touch-callout: none) {
        input, textarea, select {
          font-size: 16px !important;
        }
      }
      :root {
        /* ─── Brand pivot: teal #F26B1F → orange #F26B1F ────────────────
           Source of truth for inline-style consumers: design/tokens.ts.
           `--accent` is the brand colour for CTAs/selected states. It
           does NOT carry "good/correct/complete" semantics — use
           `--success` for those. */
        --accent: 242, 107, 31;
        --accent-hex: #F26B1F;
        --accent-dark: 181, 77, 20;
        --accent-dark-hex: #B54D14;
        --accent-tint: 253, 238, 223;
        --accent-tint-hex: #FDEEDF;
        --accent-dark-text: 140, 58, 14;
        --accent-dark-text-hex: #8C3A0E;
        /* Success / positive semantic */
        --success: 58, 141, 95;
        --success-hex: #3A8D5F;
        --success-tint: 232, 242, 236;
        --success-tint-hex: #E8F2EC;
        --success-dark-text: 31, 95, 62;
        --success-dark-text-hex: #1F5F3E;
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);

        /* ─── Surface + text tokens (May 2026 dark-mode foundation) ─────
           These swap on `html.dark` (see block below) so any consumer
           that references the var() name automatically adapts. New code
           should reference these instead of hardcoding hex literals like
           '#1a1a1a' inside inline style props. */
        --bg-page: #f0f0f0;
        --bg-card: #ffffff;
        --bg-card-soft: #FAF7F4;
        --bg-card-cream: #FDF8F0;
        --text-primary: #1a1a1a;
        --text-body: #3a3530;
        --text-muted: #7a7068;
        --text-label: #9e9186;
        --border-strong: #1a1a1a;
        --border-soft: #d0cdc8;
        --border-faint: rgba(0, 0, 0, 0.07);
      }
      /* Dark-mode swap. Activated when the AuthContext / settings flip
         html's class to `dark` (see Settings → Dark Mode). All surface
         + text variables flip together; brand accent stays the same so
         CTAs read identically. */
      html.dark {
        --bg-page: #09090b;
        --bg-card: #18181b;          /* zinc-900 */
        --bg-card-soft: #1f1f23;
        --bg-card-cream: #1f1f23;
        --text-primary: #f4f4f5;     /* zinc-100 */
        --text-body: #d4d4d8;        /* zinc-300 */
        --text-muted: #a1a1aa;       /* zinc-400 */
        --text-label: #909099;       /* lifted from zinc-500 #71717a, which is
                                       only 3.37:1 on --bg-card and fails AA */
        --border-strong: #3f3f46;    /* zinc-700 */
        --border-soft: #27272a;      /* zinc-800 */
        --border-faint: rgba(255, 255, 255, 0.06);
        /* The accent-tint also needs a darker companion or callouts
           with bg #FDEEDF look like pink confetti on a black canvas. */
        --accent-tint-hex: rgba(242, 107, 31, 0.14);
      }

      /* ─── Mass-coverage dark overrides ──────────────────────────────
         Forty-plus educational modules hardcode hex colours via inline
         style props (e.g. style={{ color: '#1a1a1a' }}) — React renders
         these as `style="color: rgb(26, 26, 26)"` in the DOM. Attribute
         selectors below catch the dominant patterns so the modules
         become legible in dark mode without touching every file. New
         code should use the var() tokens above; these rules are the
         safety net for the existing pile. !important is necessary to
         beat inline style specificity.

         Patterns covered (hex → rgb normalisation by the browser):
           #1a1a1a / #1A1A1A → rgb(26, 26, 26)       primary text
           #3a3530          → rgb(58, 53, 48)        body text
           #7a7068          → rgb(122, 112, 104)     muted
           #9e9186          → rgb(158, 145, 134)     label
           #ffffff / white  → rgb(255, 255, 255)     card bg
           #FAF7F4          → rgb(250, 247, 244)     cream soft
           #FDF8F0          → rgb(253, 248, 240)     cream
           #f0f0f0          → rgb(240, 240, 240)     page bg
           rgba(0,0,0,…)    → muted text variants    */

      html.dark [style*="color: rgb(26, 26, 26)"],
      html.dark [style*="color:#1a1a1a"],
      html.dark [style*="color:#1A1A1A"] {
        color: var(--text-primary) !important;
      }
      html.dark [style*="color: rgb(58, 53, 48)"],
      html.dark [style*="color:#3a3530"] {
        color: var(--text-body) !important;
      }
      html.dark [style*="color: rgb(122, 112, 104)"],
      html.dark [style*="color:#7a7068"] {
        color: var(--text-muted) !important;
      }
      html.dark [style*="color: rgb(158, 145, 134)"],
      html.dark [style*="color:#9e9186"] {
        color: var(--text-label) !important;
      }
      html.dark [style*="color: rgba(0, 0, 0, 0.5)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.55)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.6)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.62)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.65)"] {
        color: var(--text-muted) !important;
      }
      html.dark [style*="color: rgba(0, 0, 0, 0.7)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.75)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.8)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.85)"],
      html.dark [style*="color: rgba(0, 0, 0, 0.9)"] {
        color: var(--text-body) !important;
      }

      /* Backgrounds — both `background:` and `background-color:` shorthands. */
      html.dark [style*="background: rgb(255, 255, 255)"],
      html.dark [style*="background-color: rgb(255, 255, 255)"],
      html.dark [style*="background:#fff"],
      html.dark [style*="background-color:#fff"],
      html.dark [style*="background:#FFFFFF"],
      html.dark [style*="background-color:#FFFFFF"],
      html.dark [style*="background: white"],
      html.dark [style*="background-color: white"] {
        background-color: var(--bg-card) !important;
      }
      html.dark [style*="background: rgb(250, 247, 244)"],
      html.dark [style*="background-color: rgb(250, 247, 244)"],
      html.dark [style*="background:#FAF7F4"],
      html.dark [style*="background-color:#FAF7F4"] {
        background-color: var(--bg-card-soft) !important;
      }
      html.dark [style*="background: rgb(253, 248, 240)"],
      html.dark [style*="background-color: rgb(253, 248, 240)"],
      html.dark [style*="background:#FDF8F0"],
      html.dark [style*="background-color:#FDF8F0"] {
        background-color: var(--bg-card-cream) !important;
      }
      html.dark [style*="background: rgb(240, 240, 240)"],
      html.dark [style*="background-color: rgb(240, 240, 240)"] {
        background-color: var(--bg-page) !important;
      }

      /* Borders — only the strong-black `#1a1a1a` border tokens that the
         module visual system uses as the canonical card border. The
         softer #d0cdc8 borders read OK against dark surfaces already. */
      html.dark [style*="border-color: rgb(26, 26, 26)"],
      html.dark [style*="border:2px solid #1a1a1a"],
      html.dark [style*="border: 2px solid #1a1a1a"],
      html.dark [style*="border:2px solid #1A1A1A"],
      html.dark [style*="border: 2px solid #1A1A1A"] {
        border-color: var(--border-strong) !important;
      }
      @keyframes sectionFadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .section-enter {
        animation: sectionFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      @media print {
        nav, footer, button {
          display: none !important;
        }
      }
      /* Card style overrides — triggered by data-card-style on <body> */
      /* Glass — dramatic frosted effect */
      body[data-card-style="glass"] .card-styled {
        background: rgba(255, 255, 255, 0.35) !important;
        backdrop-filter: blur(24px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.4) !important;
      }
      html.dark body[data-card-style="glass"] .card-styled {
        background: rgba(25, 25, 25, 0.4) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important;
      }
      /* Neon — readable with glowing accent borders */
      body[data-card-style="neon"] .card-styled {
        background: white !important;
        border: 2px solid rgba(var(--accent), 0.5) !important;
        box-shadow: 0 0 20px rgba(var(--accent), 0.15), 0 0 60px rgba(var(--accent), 0.05) !important;
      }
      html.dark body[data-card-style="neon"] .card-styled {
        background: #191919 !important;
        border: 2px solid rgba(var(--accent), 0.5) !important;
        box-shadow: 0 0 20px rgba(var(--accent), 0.2), 0 0 60px rgba(var(--accent), 0.08) !important;
      }
      /* Flat — bold accent borders, zero shadows */
      body[data-card-style="flat"] .card-styled {
        background: white !important;
        border: 3px solid rgba(var(--accent), 0.3) !important;
        border-radius: 0.75rem !important;
        box-shadow: none !important;
      }
      html.dark body[data-card-style="flat"] .card-styled {
        background: #191919 !important;
        border: 3px solid rgba(var(--accent), 0.25) !important;
      }
      /* Gradient — subtle accent gradient */
      body[data-card-style="gradient"] .card-styled {
        background: linear-gradient(135deg, white, rgba(var(--accent), 0.08)) !important;
        border: 1px solid rgba(var(--accent), 0.12) !important;
      }
      html.dark body[data-card-style="gradient"] .card-styled {
        background: linear-gradient(135deg, #191919, rgba(var(--accent), 0.12)) !important;
        border: 1px solid rgba(var(--accent), 0.1) !important;
      }
      /* Login page blob animations */
      @keyframes loginBlob1 { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(100px,-50px) scale(1.1); } 66% { transform: translate(-60px,80px) scale(0.9); } 100% { transform: translate(0,0) scale(1); } }
      @keyframes loginBlob2 { 0% { transform: translate(0,0) scale(1); } 25% { transform: translate(-80px,60px) scale(1.15); } 50% { transform: translate(40px,100px) scale(0.85); } 75% { transform: translate(70px,-40px) scale(1.05); } 100% { transform: translate(0,0) scale(1); } }
      @keyframes loginBlob3 { 0% { transform: translate(0,0) scale(1); } 33% { transform: translate(60px,70px) scale(0.95); } 66% { transform: translate(-90px,-30px) scale(1.1); } 100% { transform: translate(0,0) scale(1); } }
      @keyframes loginBlob4 { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-60px) scale(1.12); } 100% { transform: translate(0,0) scale(1); } }
      .animate-login-blob-1 { animation: loginBlob1 15s ease-in-out infinite; }
      .animate-login-blob-2 { animation: loginBlob2 20s ease-in-out infinite; }
      .animate-login-blob-3 { animation: loginBlob3 25s ease-in-out infinite; }
      .animate-login-blob-4 { animation: loginBlob4 18s ease-in-out infinite; }
    </style>
</head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
