<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextStepUni</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Source Serif 4 is self-hosted (components/landing/fx-foundation/foundation.css): the Google build strips
         old-style and tabular figures and small caps. The roman face is above the fold, so it is preloaded. -->
    <link rel="preload" href="/components/landing/fx-foundation/fonts/SourceSerif4Variable-Roman.otf.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- DM Sans with its optical-size axis, so the wordmark can change cut as the nav condenses. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Apercu Mono Pro';
        src: url('/fonts/ApercuMonoPro.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      html { background: #FFFFFF; }
      body { margin: 0; background: #FFFFFF; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      /* Cross-document view transitions with the app (components/landing/leave.ts).
         The opt-in has to be here, in static HTML, because the browser reads it
         before any module runs; #landing-mark is the door he comes home through. */
      @view-transition { navigation: auto; }
      ::view-transition-group(starguy) { animation-duration: 0.65s; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.2s; }
      @media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
      #landing-mark { position: fixed; left: 24px; bottom: 22px; width: 52px; z-index: 45; pointer-events: none; display: none; }
      #landing-mark[data-here] { display: block; }
      #landing-mark img { display: block; width: 100%; height: auto; }
      /* One of him at a time: while he stands on the door, the hero's copy waits. */
      body:has(#landing-mark[data-here]) [data-starguy-slot="hero"] { visibility: hidden !important; }
    </style>
    <link rel="expect" href="#landing-mark" blocking="render" />
  </head>
  <body>
    <div id="root"></div>
    <div id="landing-mark" aria-hidden="true"><img src="/assets/landing/starguy-door.png" alt="" /></div>
    <script src="/landing-door.js"></script>
    <script type="module" src="/landing-dev.tsx"></script>
  </body>
</html>
