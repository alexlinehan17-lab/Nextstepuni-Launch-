{
  "name": "Mark Bank LCVP source links and canonical storage",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "codex/markbank-verify-fifth-source-links-v2-20261113"
      ]
    }
  },
  "concurrency": {
    "group": "codex/markbank-verify-fifth-source-links-v2-20261113",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify-candidate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "VITEST_MAX_WORKERS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 2
          }
        },
        {
          "name": "Verify exact candidate and workflow-only change",
          "id": "integrity",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD^)\" = d3610ce6c3e323183206db5933a159ee85270f03\ntest \"$(git diff --name-only HEAD^ HEAD)\" = .github/workflows/markbank-fifth-source-links-v2-20261113.yml\ngit show --no-patch --format=fuller HEAD"
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "name": "Install dependencies",
          "id": "dependencies",
          "run": "npm ci"
        },
        {
          "name": "Generate scoped test type configuration",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "python3 - <<'PYCONFIG'\nimport json\nfrom pathlib import Path\np=Path('tmp/continuous-review/nov12-fifth-batch-test-tsconfig.json')\np.parent.mkdir(parents=True,exist_ok=True)\np.write_text(json.dumps({'extends': '../../tsconfig.test.json', 'include': ['../../test/curriculumRegistry.test.ts', '../../test/markBankCardPreservation.test.ts', '../../test/markBankDeck.test.ts', '../../test/japanese2010HigherMarkBank.test.ts', '../../test/japaneseSourceRules.test.ts', '../../test/japaneseSourceAnswers.test.ts', '../../test/japaneseSourceBank.test.ts', '../../test/japanese2011OrdinaryMarkBank.test.ts', '../../test/japanese2026MarkBank.test.ts', '../../test/japanese2026OrdinaryMarkBank.test.ts', '../../test/russian2020HigherReviewed.test.tsx', '../../test/russian2020ConfidenceIntegration.test.tsx', '../../test/markBankLcvp2016.test.ts', '../../test/lcvp2016ConfidenceIntegration.test.tsx', '../../test/markBankLcvpIdentity.test.ts', '../../test/linkModulesExamTopics.test.ts', '../../test/markBankUnpricedSummary.test.tsx', '../../test/markBankLibraryCoverage.test.ts', '../../test/markBankLibraryConfidence.test.tsx', '../../test/subjectShowcase.test.ts', '../../test/askThePapers.test.tsx', '../../test/markBankCoverage.test.ts', '../../vite-env.d.ts', '../../test/setup.ts', '../../test/markBankLcvpSourceLinks.test.tsx', '../../test/markBankLcvpDeferredSources.test.ts', '../../test/markBankSourceMaterialReader.test.tsx']},indent=2)+'\\n')\nPYCONFIG"
        },
        {
          "name": "Full application types",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "npm run typecheck"
        },
        {
          "name": "Scoped test types",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=8192 node_modules/typescript/lib/tsc.js --noEmit -p tmp/continuous-review/nov12-fifth-batch-test-tsconfig.json"
        },
        {
          "name": "Required and source-reader regression tests",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/curriculumRegistry.test.ts test/markBankCardPreservation.test.ts test/markBankDeck.test.ts test/markBankLcvp2016.test.ts test/lcvp2016ConfidenceIntegration.test.tsx test/markBankLcvpIdentity.test.ts test/markBankLcvpSourceLinks.test.tsx test/markBankLcvpDeferredSources.test.ts test/markBankSourceMaterialReader.test.tsx --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default"
        },
        {
          "name": "LCVP coverage",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/markBankCoverage.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default -t 'link-modules|lcvp'"
        },
        {
          "name": "Changed source-link test lint",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node node_modules/eslint/bin/eslint.js test/markBankLcvpSourceLinks.test.tsx components/MarkBank/cards/lcvp/common.ts --max-warnings 0 components/MarkBank/SourceMaterialReader.tsx"
        },
        {
          "name": "Changed source resolver syntax",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --check scripts/markbank/paperIndex.mjs"
        },
        {
          "name": "Normal production build",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "npm run build"
        },
        {
          "name": "Prepare source-reader browser harness",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "python3 - <<'PYFILES'\nfrom pathlib import Path\nimport base64\nfiles={'tmp/continuous-review/remote-browser/capture.mjs': '', 'tmp/continuous-review/remote-browser/index.html': '', 'tmp/continuous-review/remote-browser/review.tsx': '', 'tmp/continuous-review/remote-browser/vite.config.mjs': ''}\nfor filename,content in files.items():\n p=Path(filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(content))\nPYFILES"
        },
        {
          "name": "Install isolated browser tools",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "npm install --prefix \"$RUNNER_TEMP/markbank-browser\" --no-package-lock --ignore-scripts playwright@1.63.0\nnode \"$RUNNER_TEMP/markbank-browser/node_modules/playwright/cli.js\" install --with-deps chromium"
        },
        {
          "name": "Verify8LCVP desktop/phone scenarios with original readers before reveal",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "PLAYWRIGHT_MODULE_PATH=\"$RUNNER_TEMP/markbank-browser/node_modules/playwright/index.mjs\" MARKBANK_SCREENSHOTS=\"$RUNNER_TEMP/markbank-source-review/desktop-phone\" MARKBANK_REVIEW_CARDS='[{\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-b2a\", \"confidence\": true, \"sourceReader\": {\"title\": \"Glenor Community Project \\u2014 complete case study\", \"fileid\": \"LC462CLPO00EV.pdf\", \"page\": 8, \"subjectId\": \"link-modules\", \"requireDocument\": true}}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c3d\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-a7\", \"confidence\": false}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c4b\", \"confidence\": false, \"sourceReader\": {\"title\": \"Choco Ltd \\u2014 complete original advertisement\", \"fileid\": \"LC462CLPO00EV.pdf\", \"page\": 23, \"note\": \"The four underlined terms are interpersonal skills, covering letter, references and Personnel Manager.\", \"subjectId\": \"link-modules\", \"requireDocument\": true}}]' node tmp/continuous-review/remote-browser/capture.mjs"
        },
        {
          "name": "Verify3complete phone scheme scroll sequences",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "PLAYWRIGHT_MODULE_PATH=\"$RUNNER_TEMP/markbank-browser/node_modules/playwright/index.mjs\" MARKBANK_SCREENSHOTS=\"$RUNNER_TEMP/markbank-source-review/phone-scroll\" MARKBANK_SCROLL_DETAILS=1 MARKBANK_REVIEW_VIEWPORTS='[{\"width\": 390, \"height\": 844}]' MARKBANK_REVIEW_CARDS='[{\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-b2a\", \"confidence\": true, \"sourceReader\": {\"title\": \"Glenor Community Project \\u2014 complete case study\", \"fileid\": \"LC462CLPO00EV.pdf\", \"page\": 8, \"subjectId\": \"link-modules\", \"requireDocument\": true}}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c3d\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c4b\", \"confidence\": false, \"sourceReader\": {\"title\": \"Choco Ltd \\u2014 complete original advertisement\", \"fileid\": \"LC462CLPO00EV.pdf\", \"page\": 23, \"note\": \"The four underlined terms are interpersonal skills, covering letter, references and Personnel Manager.\", \"subjectId\": \"link-modules\", \"requireDocument\": true}}]' node tmp/continuous-review/remote-browser/capture.mjs"
        },
        {
          "name": "Verify tracked files stayed unchanged",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "git diff --exit-code"
        },
        {
          "name": "Upload visual review evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "markbank-source-review",
            "path": "${{ runner.temp }}/markbank-source-review",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
