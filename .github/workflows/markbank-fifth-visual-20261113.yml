{
  "name": "Mark Bank fifth source batch browser review 13 November",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "codex/markbank-verify-fifth-visual-20261113"
      ]
    }
  },
  "concurrency": {
    "group": "codex/markbank-verify-fifth-visual-20261113",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify-candidate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "VITEST_MAX_WORKERS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 2
          }
        },
        {
          "name": "Verify exact candidate and workflow-only change",
          "id": "integrity",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD^)\" = 2511607ad3c27713ee848c971f8634c0e1b5fff3\ntest \"$(git diff --name-only HEAD^ HEAD)\" = .github/workflows/markbank-fifth-visual-20261113.yml\ngit show --no-patch --format=fuller HEAD"
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "name": "Install dependencies",
          "id": "dependencies",
          "run": "npm ci"
        },
        {
          "name": "Prepare isolated production-component harness",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "python3 - <<'PYFILES'\nfrom pathlib import Path\nimport base64\nfiles={'tmp/continuous-review/remote-browser/capture.mjs': '', 'tmp/continuous-review/remote-browser/index.html': '', 'tmp/continuous-review/remote-browser/review.tsx': '', 'tmp/continuous-review/remote-browser/vite.config.mjs': ''}\nfor filename,content in files.items():\n p=Path(filename);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(content))\nPYFILES"
        },
        {
          "name": "Install isolated browser tools",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "npm install --prefix \"$RUNNER_TEMP/markbank-browser\" --no-package-lock --ignore-scripts playwright@1.63.0\nnode \"$RUNNER_TEMP/markbank-browser/node_modules/playwright/cli.js\" install --with-deps chromium"
        },
        {
          "name": "Capture 30 desktop and phone source-card scenarios",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "PLAYWRIGHT_MODULE_PATH=\"$RUNNER_TEMP/markbank-browser/node_modules/playwright/index.mjs\" MARKBANK_SCREENSHOTS=\"$RUNNER_TEMP/markbank-source-review/desktop-phone\" MARKBANK_REVIEW_CARDS='[{\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-1aa\", \"confidence\": false, \"questionPrompts\": [\"Look at product reviews left by customers\", \"Take part in an auction\", \"Look at the water category\", \"Check your shopping cart\", \"Find out about this month\\u2019s special offers\", \"Go to the homepage\", \"Look at the tea category\"]}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-3b\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-4b\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-5\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-6\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-la\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-se\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l1\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l2\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l3\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l4\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-b2a\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c3d\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-a7\", \"confidence\": false}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c4b\", \"confidence\": false}]' node tmp/continuous-review/remote-browser/capture.mjs"
        },
        {
          "name": "Capture 13 complete phone scheme scroll sequences",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "PLAYWRIGHT_MODULE_PATH=\"$RUNNER_TEMP/markbank-browser/node_modules/playwright/index.mjs\" MARKBANK_SCREENSHOTS=\"$RUNNER_TEMP/markbank-source-review/phone-scroll\" MARKBANK_SCROLL_DETAILS=1 MARKBANK_REVIEW_VIEWPORTS='[{\"width\": 390, \"height\": 844}]' MARKBANK_REVIEW_CARDS='[{\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-1aa\", \"confidence\": false, \"questionPrompts\": [\"Look at product reviews left by customers\", \"Take part in an auction\", \"Look at the water category\", \"Check your shopping cart\", \"Find out about this month\\u2019s special offers\", \"Go to the homepage\", \"Look at the tea category\"]}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-3b\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-4b\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-5\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-6\", \"confidence\": false}, {\"subject\": \"japanese\", \"label\": \"Japanese\", \"level\": \"higher\", \"card\": \"ja-2010-hl-la\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-se\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l1\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l2\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l3\", \"confidence\": true}, {\"subject\": \"russian\", \"label\": \"Russian\", \"level\": \"higher\", \"card\": \"ru-2020-hl-l4\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-b2a\", \"confidence\": true}, {\"subject\": \"lcvp\", \"label\": \"LCVP\", \"level\": \"common\", \"card\": \"lcvp-2016-cl-c3d\", \"confidence\": true}]' node tmp/continuous-review/remote-browser/capture.mjs"
        },
        {
          "name": "Verify tracked files stayed unchanged",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "git diff --exit-code"
        },
        {
          "name": "Upload visual review evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "markbank-source-review",
            "path": "${{ runner.temp }}/markbank-source-review",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
