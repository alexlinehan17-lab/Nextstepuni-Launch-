name: Verify and deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:test

      - name: Test
        run: npm run test:all

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}

      - name: Synchronise Android client
        run: npx --no-install cap sync android

      - name: Prune hosted figure corpus from native bundle
        run: npm run cap:prune

      - name: Build Android client
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Full dependency audit
        # npm retired the quick-audit endpoint (400s from older clients, seen
        # 2026-09-04); run the audit with a current npm that speaks the bulk
        # advisory endpoint.
        run: |
          npm install -g npm@^11
          npm audit --audit-level=high

      - name: Upload verified web build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  verify-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Full dependency audit
        # Same bulk-endpoint requirement as the web audit above.
        run: |
          npm install -g npm@^11
          npm audit --audit-level=high
        working-directory: functions

  deploy-hosting:
    if: github.event_name == 'push'
    # Publish the client only after its matching rules/functions are live. If a
    # backend deploy fails, the existing client remains in place.
    needs: [verify-web, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Authenticate with short-lived Workload Identity credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: nextstepuni-app
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Download verified web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      - name: Deploy verified build to Firebase Hosting
        run: npx --no-install firebase deploy --only hosting --project nextstepuni-app --non-interactive

  deploy-backend:
    if: github.event_name == 'push'
    needs: [verify-web, verify-functions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm ci

      - name: Build Cloud Functions
        run: npm run build
        working-directory: functions

      - name: Authenticate with short-lived Workload Identity credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: nextstepuni-app
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Firestore, Storage, and Cloud Functions
        run: npx --no-install firebase deploy --only firestore,storage,functions --project nextstepuni-app --non-interactive
