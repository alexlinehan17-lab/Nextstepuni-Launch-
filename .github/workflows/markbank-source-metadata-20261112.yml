{
  "name": "Mark Bank deferred source metadata verification",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "codex/markbank-verify-source-metadata-20261112"
      ]
    }
  },
  "concurrency": {
    "group": "codex/markbank-verify-source-metadata-20261112",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify-candidate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "VITEST_MAX_WORKERS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 2
          }
        },
        {
          "name": "Verify exact candidate and workflow-only change",
          "id": "integrity",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD^)\" = 4a9e6a24b20ef0dcbab2c7ac783c0507dd6fb1fd\ntest \"$(git diff --name-only HEAD^ HEAD)\" = .github/workflows/markbank-source-metadata-20261112.yml\ngit show --no-patch --format=fuller HEAD"
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "name": "Install dependencies",
          "id": "dependencies",
          "run": "npm ci"
        },
        {
          "name": "Source metadata and strict byte-verification regressions",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --test scripts/markbank/deferredSourceMetadata.test.mjs scripts/markbank/physicsSources.test.mjs"
        },
        {
          "name": "Scoped lint",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node node_modules/eslint/bin/eslint.js scripts/markbank/physicsSources.mjs scripts/markbank/homeEconomicsSources.mjs scripts/markbank/physicsSources.test.mjs scripts/markbank/deferredSourceMetadata.test.mjs test/markBankDeck.test.ts test/markBankHomeEconomicsDeferred.test.ts --max-warnings 0"
        },
        {
          "name": "Generate scoped test configuration",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "python3 - <<'PYCONFIG'\nimport json\nfrom pathlib import Path\np=Path('tmp/continuous-review/nov12-source-metadata-tsconfig.json')\np.parent.mkdir(parents=True,exist_ok=True)\np.write_text(json.dumps({'extends': '../../tsconfig.test.json', 'include': ['../../test/askThePapers.test.tsx', '../../test/curriculumRegistry.test.ts', '../../test/japanese2011HigherMarkBank.test.ts', '../../test/japanese2012HigherMarkBank.test.ts', '../../test/japanese2014HigherMarkBank.test.ts', '../../test/japanese2015HigherMarkBank.test.ts', '../../test/japanese2016HigherMarkBank.test.ts', '../../test/japanese2017HigherMarkBank.test.ts', '../../test/japanese2018HigherMarkBank.test.ts', '../../test/japanese2019HigherMarkBank.test.ts', '../../test/japanese2020HigherMarkBank.test.ts', '../../test/japanese2021HigherMarkBank.test.ts', '../../test/japanese2022HigherMarkBank.test.ts', '../../test/japanese2023HigherMarkBank.test.ts', '../../test/japanese2024HigherMarkBank.test.ts', '../../test/japanese2025HigherMarkBank.test.ts', '../../test/japanese2026MarkBank.test.ts', '../../test/japaneseSourceAnswers.test.ts', '../../test/japaneseSourceBank.test.ts', '../../test/japaneseSourceRules.test.ts', '../../test/markBankCardPreservation.test.ts', '../../test/markBankDeck.test.ts', '../../test/markBankLcvp2019.test.ts', '../../test/markBankLcvp2020.test.ts', '../../test/markBankLcvpIdentity.test.ts', '../../test/markBankLibraryConfidence.test.tsx', '../../test/markBankLibraryCoverage.test.ts', '../../test/markBankUnpricedSummary.test.tsx', '../../test/russian2010HigherReviewed.test.tsx', '../../test/russian2010OrdinaryReviewed.test.ts', '../../test/russian2012ConfidenceIntegration.test.tsx', '../../test/russian2012ConfidenceReview.test.tsx', '../../test/russian2012HigherReviewed.test.ts', '../../test/russianSummaryLanguageExceptions.test.ts', '../../test/subjectShowcase.test.ts', '../../vite-env.d.ts', '../../test/setup.ts', '../../test/markBankHomeEconomicsDeferred.test.ts']},indent=2)+'\\n')\nPYCONFIG"
        },
        {
          "name": "Scoped test types (36 files)",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=8192 node_modules/typescript/lib/tsc.js --noEmit -p tmp/continuous-review/nov12-source-metadata-tsconfig.json"
        },
        {
          "name": "Complete deck checks",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/markBankDeck.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default"
        },
        {
          "name": "Card preservation",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/markBankCardPreservation.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default"
        },
        {
          "name": "Curriculum registry",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/curriculumRegistry.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default"
        },
        {
          "name": "Home Economics deferred source and Atlas contracts",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "node --max-old-space-size=2048 node_modules/vitest/vitest.mjs run test/markBankHomeEconomicsDeferred.test.ts --pool=forks --maxWorkers=1 --no-file-parallelism --reporter=default"
        },
        {
          "name": "Verify tracked files stayed unchanged",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "git diff --exit-code"
        }
      ]
    }
  }
}
