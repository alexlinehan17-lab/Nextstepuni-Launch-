{
  "name": "Mark Bank source-card desktop and phone review",
  "permissions": {
    "contents": "read"
  },
  "on": {
    "push": {
      "branches": [
        "codex/markbank-verify-visual-20261112"
      ]
    }
  },
  "concurrency": {
    "group": "codex/markbank-verify-visual-20261112",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify-candidate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "VITEST_MAX_WORKERS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 2
          }
        },
        {
          "name": "Verify exact candidate and workflow-only change",
          "id": "integrity",
          "shell": "bash",
          "run": "test \"$(git rev-parse HEAD^)\" = 8d5614d017459c2887988edff37d9b57bc851603\ntest \"$(git diff --name-only HEAD^ HEAD)\" = .github/workflows/markbank-source-visual-20261112.yml\ngit show --no-patch --format=fuller HEAD"
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 22,
            "cache": "npm"
          }
        },
        {
          "name": "Install dependencies",
          "id": "dependencies",
          "run": "npm ci"
        },
        {
          "name": "Prepare isolated production-component harness",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "python3 - <<'PYFILES'\nfrom pathlib import Path\nimport base64\nfiles={'tmp/continuous-review/remote-browser/index.html': '', 'tmp/continuous-review/remote-browser/vite.config.mjs': '', 'tmp/continuous-review/remote-browser/capture.mjs': '', 'tmp/continuous-review/remote-browser/review.tsx': ''}\nfor name,value in files.items():\n p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(value))\nPYFILES"
        },
        {
          "name": "Install isolated browser tools",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "npm install --prefix \"$RUNNER_TEMP/markbank-browser\" --no-package-lock --ignore-scripts playwright@1.63.0\nnode \"$RUNNER_TEMP/markbank-browser/node_modules/playwright/cli.js\" install --with-deps chromium"
        },
        {
          "name": "Capture source-card desktop and phone views",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "PLAYWRIGHT_MODULE_PATH=\"$RUNNER_TEMP/markbank-browser/node_modules/playwright/index.mjs\" MARKBANK_SCREENSHOTS=\"$RUNNER_TEMP/markbank-source-review\" MARKBANK_LCVP_CARD=lcvp-2019-cl-c6b node tmp/continuous-review/remote-browser/capture.mjs"
        },
        {
          "name": "Verify tracked files stayed unchanged",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.integrity.outcome == 'success' }}",
          "run": "git diff --exit-code"
        },
        {
          "name": "Upload visual review evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "markbank-source-review",
            "path": "${{ runner.temp }}/markbank-source-review",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
